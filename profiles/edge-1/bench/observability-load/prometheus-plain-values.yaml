# Plain Prometheus for the observability plane, in place of the metrics
# module's kube-prometheus-stack (plan 023 decision 3's fallback, tried in
# T003). Chart: prometheus-community/prometheus 29.47.2. No operator, so
# no monitoring.coreos.com CRDs.
#
# It stands in for kube-prometheus-stack as far as the module's metrics
# adapter can tell:
#   - the Service name and port the adapter's PROMETHEUS_ADDRESS fixes
#     (openchoreo-observability-prometheus:9091);
#   - the same two sources, with kube-prometheus-stack's job names: the
#     kubelet's cAdvisor endpoint (job "kubelet") and kube-state-metrics
#     limited to the module's pod metrics and openchoreo.dev labels.
# Images are pinned to the ones the module uses.

server:
  fullnameOverride: openchoreo-observability-prometheus
  image:
    tag: v3.15.1-distroless
  service:
    servicePort: 9091
  retention: 3d
  retentionSize: 2GB
  persistentVolume:
    size: 3Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

configmapReload:
  prometheus:
    image:
      tag: v0.94.2

alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  fullnameOverride: kube-state-metrics
  image:
    tag: v2.20.0
  collectors:
    - pods
  metricAllowlist:
    - kube_pod_completion_time
    - kube_pod_container_resource_limits
    - kube_pod_container_resource_requests
    # Spec 024: the restarts alert condition (conditions.go).
    - kube_pod_container_status_restarts_total
    - kube_pod_info
    - kube_pod_init_container_resource_limits
    - kube_pod_init_container_resource_requests
    - kube_pod_labels
    - kube_pod_start_time
    - kube_pod_status_phase
  metricLabelsAllowlist:
    - pods=[openchoreo.dev/component-uid,openchoreo.dev/project-uid,openchoreo.dev/environment-uid,openchoreo.dev/release-line-uid,openchoreo.dev/release-line-component-uid,openchoreo.dev/namespace,openchoreo.dev/component,openchoreo.dev/project,openchoreo.dev/environment]

# Only the two sources the adapter reads, and Hubble's request and flow
# counters (spec 025); the chart's other defaults (pods, services,
# endpoints, API server, nodes) would scrape far more.
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  kubelet:
    job_name: kubelet
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: metrics_path
        replacement: /metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
  kube-state-metrics:
    job_name: kube-state-metrics
    honor_labels: true
    static_configs:
      - targets:
          - kube-state-metrics:8080
  # Spec 025 (plan decision 7): Hubble's metrics, one target per node
  # through the headless hubble-metrics Service Cilium's chart makes. On a
  # cluster without Cilium the name doesn't resolve and the job has no
  # targets. Only the request, drop and flow counters are kept: Hubble
  # exports more, and the pod-context labels make them many series.
  hubble:
    job_name: hubble
    dns_sd_configs:
      - names:
          - hubble-metrics.kube-system.svc.cluster.local
        type: A
        port: 9965
        refresh_interval: 1m
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: hubble_(http_requests_total|http_request_duration_seconds_(bucket|sum|count)|drop_total|flows_processed_total)
        action: keep
