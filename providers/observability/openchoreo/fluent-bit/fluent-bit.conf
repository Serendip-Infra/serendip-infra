[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name tail
    Buffer_Chunk_Size 32KB
    Buffer_Max_Size 2MB
    DB /var/lib/fluent-bit/db/tail-container-logs.db
    Exclude_Path /var/log/containers/fluent-bit-*.log,/var/log/containers/*_kube-system_*.log
    Inotify_Watcher false
    Mem_Buf_Limit 100MB
    Path /var/log/containers/*.log
    multiline.parser docker, cri
    Read_from_Head On
    Refresh_Interval 5
    Skip_Long_Lines On
    Tag kube.*

[FILTER]
    Name kubernetes
    Buffer_Size 15MB
    K8S-Logging.Parser On
    K8S-Logging.Exclude On
    Keep_Log On
    Match kube.*
    Merge_Log Off
    tls.verify Off
    Use_Kubelet true

# Cluster identity stamped by the logs collector
[FILTER]
    Name modify
    Match kube.*
    Set openchoreo_cluster_instance serendip

[OUTPUT]
    Name http
    Match kube.*
    Host openobserve
    Port 5080
    URI /api/default/default/_json
    Format json
    http_user ${OPENOBSERVE_USERNAME}
    http_passwd ${OPENOBSERVE_PASSWORD}
    tls Off
